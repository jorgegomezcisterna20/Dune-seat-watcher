name: Monitor Dune Part Three - AMC Lincoln Square 13

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar el ultimo estado guardado
        uses: actions/cache@v4
        with:
          path: state.json
          key: dune-watch-state-${{ github.run_id }}
          restore-keys: |
            dune-watch-state-

      - name: Revisar disponibilidad y avisar si corresponde
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_dune.py
